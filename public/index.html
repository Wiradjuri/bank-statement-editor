<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><title>Layout Preservation System</title><style>body{font-family:Arial;background:#f5f5f5;color:#333;display:flex;flex-direction:column;height:100vh;}header{background:#2c3e50;color:white;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;}main{display:flex;flex:1;}aside{width:280px;background:white;border-right:1px solid #ddd;padding:15px;}aside h2{font-size:13px;margin-bottom:8px;color:#2c3e50;}#doc-view{flex:1;overflow:auto;padding:20px;}#doc-paper{width:595px;height:842px;background:white;margin:0 auto;position:relative;box-shadow:0 0 10px rgba(0,0,0,0.1);}.page{position:relative;width:100%;}.element{position:absolute;padding:2px;cursor:pointer;white-space:pre-wrap;}.element:hover{opacity:0.8;}.element.selected{border:1px solid #3498db;background:rgba(52,152,219,0.1);}</style></head><body><header><h1>📄 Layout Preservation System</h1><div><button onclick=document.getElementById(fp).click()>📁 Open</button><button onclick=alert(v1.0.0)>❓ Help</button></div></header><main><aside><h2>Document</h2><div>Fm:<span id=doc-fm></span>, Pages:<span id=doc-pg></span></div><h2>Edit</h2><select id=sel><option value>None</option></select><button id=btn disabled onclick=app.openEdit()>Edit</button><input id=idx disabled></div></aside><div id=doc-view><div id=doc-paper>No document</div></div></main><script>const Store={layout:null,sel:null};const app={render(){const p=Store.layout?.pages||[];const d=document.getElementById(doc-paper);if(p.length){d.innerHTML=p.map((pg,i)=>{const el=pg.elements||[];const w=pg.dimensions?.width||595,h=pg.dimensions?.height||842;return `<div style=width:${w}px;height:${h}px;position:relative;>${el.map(x=>{const px=x.position?.point?.x||100,py=x.position?.point?.y||100,sz=x.style?.fontSize||12,col=x.style?.color||#000495,cl=(x.id===Store.sel?selected);return <div class=element id=${x.id} style=position:absolute;left:${px}px;top:${py}px;font-size:${sz}px;color:${col};${cl}>${x.content}</div>;}).join}<div style=position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#666;font-size:11px;>Page ${pg.pageNumber}</div></div>;}).join()}else{d.innerHTML=<div style=text-align:center;color:#999;padding:40px;>Select a file to open</div>}},load(r){if(r.success){Store.layout=r.layout;Store.sel=null;this.render();this.updateStats()}else alert(Error:+r.error)},upd(){const el=document.getElementById(sel);el.innerHTML=<option value>None</option>+Store.layout?.pages.flatMap(p=>p.elements||[]).map(x=>${x.id}${x.id===Store.sel(selected && x.content|| );document.getElementById(btn).disabled=!Store.sel;return el},stats(){let t=0,tx=0,hd=0,img=0,wd=0;Store.layout?.pages.forEach(p=>{p.elements.forEach(e=>{t++;if(e.type===text)tx++;if(e.type===heading)hd++;if(e.type===image)img++;wd+=e.content.match(\w+)?.length||0})});document.getElementById(dt).textContent=t;document.getElementById(txt).textContent=tx;document.getElementById(hds).textContent=hd;document.getElementById(ims).textContent=img;document.getElementById(wns).textContent=wd},selectID=id=document.querySelectorAll(.selected).forEach(e=>e.classList.remove(selected));const e=document.getElementById(id);if(e){e.classList.add(selected);Store.sel=id;app.upd()};run()};app.run=async()=>{document.getElementById(fi).onchange=async e=>{const r=Store.sel=null;const r=await window.electronAPI?.loadDocument?.(e.target.files[0]?.path);if(r?.success){Store.layout=r.layout;app.render();app.updateStats()}else alert(Error:+r.error)};app.render()};app.run();< /script></body></html>
